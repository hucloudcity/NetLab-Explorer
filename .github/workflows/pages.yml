name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check JavaScript
        run: node --check src/app/app.js
      - name: Type-check data model (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Validate content data (L1 Zod + L2 cross-refs + L3 gates)
        run: node scripts/validate-content.mts
      - name: Run data model tests (waves / fold / gates / schema / multicast)
        run: node scripts/test-data-model.mts
      - name: Run content, rendering, and motion checks
        run: npm run check
      - name: Build local assets
        run: npm run build
      - name: Stage site (mirror repo layout; paths are relative, prefix-agnostic)
        run: |
          mkdir -p _site
          cp -r src content dist _site/
          cp index.html _site/index.html
      - name: Verify staged paths resolve (mirrors deployed layout)
        run: node scripts/check-paths.cjs
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_ADMIN_TOKEN != '' }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
